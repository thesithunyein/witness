name: CI

# The checks CONTRIBUTING.md requires, in one place, plus the style guard. Nothing
# here needs a secret: the contract tests generate their own P-256 signatures, the
# SDK check only compares generated sources against the app's, and check-style.mjs
# only reads text.
#
# NOTE: this workflow has now run on GitHub Actions, and its first run found two
# faults in the workflow itself, both fixed in the same commit that records this:
# the contracts job never installed the root @noble/curves that scripts/sign-action.mjs
# imports (so 25 tests failed on a missing module, not on the contracts), and the SDK
# check ran from a checkout with no generated src/, which could never pass. The README
# badges remain static descriptions of local runs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # The suite shells out to `node` for real P-256 signatures, so this job needs
      # a Node runtime as well as forge.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # AND that runtime needs the module the signer imports. @noble/curves lives in
      # the ROOT package.json, not in contracts/, so this install has to run from the
      # repository root: without it every ffi call dies with ERR_MODULE_NOT_FOUND.
      - run: npm ci --no-audit --no-fund
        working-directory: .

      - run: forge fmt --check
      - run: forge test -vv

  app:
    name: app (types, worker, static bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Reads text only, so it runs before the install: a stray em dash fails the
      # job in seconds instead of after the bundles.
      - run: node ../scripts/check-style.mjs

      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit
      # `target: browser` in build-worker.mjs fails on any Node-only import, so this
      # step is the edge-compatibility check, not just a bundling check.
      - run: bun run build-worker.mjs
      - run: bun run build-static.mjs

  sdk:
    name: sdk (generated sources current)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm install --no-audit --no-fund
      # `check` fails if a generated src/ tree disagrees with app/lib. A fresh checkout
      # has no src/ at all (it is generated and gitignored), so the proof that the
      # package still matches the app is the build below: it regenerates from app/lib
      # and bundles what it generated.
      - run: bun run check
      - run: bun run build
