[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Monad supports the Fusaka precompile set (0x0100 P256, 0x1000 staking, 0x1001 reserve).
evm_version = "osaka"
ffi = true
fs_permissions = [
  { access = "read", path = "./test/vectors" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 100
tab_width = 4
